[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandlot"
version = "0.0.1"
description = "A reliable, reproducible Python client for MLB Statcast data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nickolis Kacludis", email = "nickoliskacludis@gmail.com" },
]
keywords = ["baseball", "statcast", "mlb", "sabermetrics", "analytics"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/NKacludis24/sandlot"
Repository = "https://github.com/NKacludis24/sandlot"
Issues = "https://github.com/NKacludis24/sandlot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sandlot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sandlot",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
files = ["src/sandlot", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
